# SkillSpector baseline for the vendored img2threejs skill (resources/agent-skills/img2threejs).
# Every rule is a finding that was verified by hand; the reasoning is in FINDINGS_TRIAGE.md.
# Rules are scoped to the file(s) where the finding was verified, so the same pattern anywhere
# else is still reported. Static scans only (--no-llm). Used by `npm run check:skills`.
version: 2

rules:
  # Upstream install / plugin / showcase documentation (T-01..T-03, T-09, T-10)
  - id: "RP1"
    path: "*SKILL.md"
    message: "*npx*img2threejs*"
    reason: "T-01 Upstream install line; Linden ships the skill pinned+patched, readSkillFile adds a do-not-install note, shell commands require approval"
  - id: "RP1"
    path: "*CHANGELOG.md"
    reason: "T-01 Changelog text naming the upstream npm package; documentation only"
  - id: "RP1"
    path: "*docs/INSTALL.md"
    reason: "T-01 Upstream installer documentation; installer not shipped, Linden note prepended on read"
  - id: "RP1"
    path: "*docs/PLUGINS.md"
    reason: "T-01 Upstream plugin documentation; img2 harness not shipped, IMG2_HOME isolated, Linden note prepended"
  - id: "RP1"
    path: "*docs/GLB_*CHARACTER_PROMPT.md"
    message: "npx *"
    reason: "T-01 Showcase toolchain (npx tsc/vite) in docs; showcase not shipped, Linden note prepended"
  - id: "AS1"
    path: "*docs/INSTALL.md"
    reason: "T-02 Describes what the upstream installer does to ~/.claude/settings.json; installer not shipped, external_directory denied, Linden note prepended"
  - id: "AS1"
    path: "*docs/PLUGINS.md"
    reason: "T-02 Describes host detection via ~/.claude; documentation only"
  - id: "PE3"
    path: "*docs/GLB_CHARACTER*_PROMPT.md"
    message: "*.env*"
    reason: "T-03 <subject-id>.env is the showcase build config placeholder, not a credential file; showcase not shipped, Linden note prepended"
  - id: "E3"
    path: "*docs/PLUGINS.md"
    reason: "T-09 'ls -l ~/...' troubleshooting step in docs; no data leaves the machine"
  - id: "LP3"
    path: "*SKILL.md"
    reason: "T-10 Tool scope is enforced by Linden, not frontmatter: only linden_img2_* tools, script allowlist, BLOCKED_SCRIPTS, path confinement"

  # Text the static patterns misread (T-04..T-08, T-11)
  - id: "AE4"
    reason: "T-04 Greek Δ/Σ used as math symbols (ΔE color difference, Σ sums); verified: no bidi, zero-width or tag characters in the skill"
  - id: "AR2"
    path: "*forge/stage2_spec/new_sculpt_spec.py"
    message: "*do not judge*"
    reason: "T-05 Review-pairing rule ('do not judge a front reference against a random render angle'), not an anti-refusal instruction"
  - id: "P9"
    path: "*forge/stage2_spec/new_sculpt_spec.py"
    reason: "T-06 Newline count in ordinary Python source; no hidden prompt"
  - id: "EA4"
    path: "*forge/stage3_build/uv_unwrap.py"
    reason: "T-07 Comment explaining a loop guard; the loop is bounded by max_charts and by the shrink check"
  - id: "EA2"
    path: "*grimoire/intake/local_spec_search.md"
    reason: "T-08 'automatically run' refers to the offline, local spec search; no network or external action"
  - id: "AE1"
    path: "SKILL.md"
    reason: "T-11 Partial inspection of referenced scripts/docs (static parse limit, binary struct format strings in probe_glb.py); each target was reviewed by hand"

  # Code patterns that are safe in context (T-12..T-15)
  - id: "AST4"
    path: "*forge/stage1_intake/*"
    message: "*subprocess.run*"
    reason: "T-12 macOS 'sips' image conversion with list argv (no shell); input path already confined by linden_img2_run"
  - id: "AST4"
    path: "*forge/stage4_review/make_comparison_sheet.py"
    reason: "T-12 macOS 'sips' image conversion with list argv (no shell)"
  - id: "AST4"
    path: "*forge/stage1_intake/run_vision_adapter.py"
    reason: "T-13 Runs an external vision venv by design; BLOCKED in Linden (BLOCKED_SCRIPTS), IMG2THREEJS_VISION_PYTHON never passed"
  - id: "TT2"
    path: "*forge/stage1_intake/run_vision_adapter.py"
    reason: "T-13 Same as above; blocked in Linden"
  - id: "AST4"
    path: "*forge/stage3_build/emit_target.py"
    reason: "T-13 Target toolchain runner by design; BLOCKED in Linden and --target is refused by the argument resolver"
  - id: "TT2"
    path: "*forge/stage3_build/emit_target.py"
    reason: "T-13 Same as above; blocked in Linden"
  - id: "AST3"
    message: "*__import__(\"sys\")*"
    reason: "T-14 __import__('sys') in the __main__ guard; constant module name"
  - id: "AST7"
    path: "*forge/stage5_rig/action_design.py"
    reason: "T-15 getattr over a fixed alias list on a dataclass; no attacker-chosen attribute names"
